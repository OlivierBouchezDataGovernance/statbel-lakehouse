# Business glossary of the Statbel open data (guideline DG-GDL-001).
#
# This file is the single source of the glossary: edit the terms here, then
# run glossary/generator.py (or notebook 08_glossary_import_files) to write
# the OpenMetadata import files. See glossary/README.md.
#
# Term keys
#   glossary        key of the glossary (see `glossaries`)
#   path            parent terms inside the glossary ([] = root term)
#   name            term name (unique under its parent)
#   type            SubjectArea, BusinessObject, Characteristic, Role,
#                   Measure, Classification or Identifier (with spaces)
#   definition      business definition
#   synonyms        other names, including French (FR:) and Dutch (NL:)
#   related         fully qualified names of related terms
#   source_pattern  regular expression matched against the Statbel column
#                   names, to list the source columns the term explains
#   tags            OpenMetadata tags, e.g. PersonalData.Personal
#   references      keys of `references`
#   steward_note    remark of the data steward
#
# (c) 2026 Olivier Bouchez - CC BY-NC 4.0 - https://olivier-bouchez.com

glossaries:
- key: SBV
  name: Shared Business Vocabulary
  domain: Cross-domain
  owner: Data Governance Office (Reference Data Owner)
  description: 'Business concepts reused by several domains: parties, locations,
    time and statistical classifications. Domain glossaries link to these
    terms instead of redefining them.'
- key: POP
  name: Population and Households
  domain: Population and Society
  owner: Population & Society Data Owner
  description: Concepts used to describe the resident population, households,
    vital events, names, labour, education and living conditions.
- key: ENT
  name: Enterprises and Economy
  domain: Economy
  owner: Economy Data Owner
  description: Concepts used to describe enterprises, their demography, prices
    and economic activity.
- key: MOB
  name: Mobility and Road Safety
  domain: Mobility
  owner: Mobility Data Owner
  description: Concepts used to describe road accidents, their casualties
    and the vehicles involved.
- key: BRE
  name: Buildings and Real Estate
  domain: Built Environment
  owner: Built Environment Data Owner
  description: Concepts used to describe the building stock, dwellings, land
    and the real estate market.

references:
  refnis:
    title: Statbel - Code REFNIS
    url: https://statbel.fgov.be/en/open-data/code-refnis-0
  nace:
    title: Statbel - NACE-BEL 2008
    url: https://statbel.fgov.be/en/open-data/nace-bel-2008-classification
  isco:
    title: Statbel - ISCO-2008
    url: https://statbel.fgov.be/en/open-data/isco-2008-classification-4-digits
  isced:
    title: Statbel - ISCED-F 2013
    url: https://statbel.fgov.be/en/open-data/code-isced-f-2013-4-digits
  nuts:
    title: Statbel - NUTS codes
    url: https://statbel.fgov.be/en/open-data/nuts-codes-2027
  sector:
    title: Statbel - Statistical sectors 2024
    url: https://statbel.fgov.be/en/open-data/statistical-sectors-2024
  address:
    title: Statbel - Address file with statistical sector
    url: https://statbel.fgov.be/en/open-data/address-file-statistical-sector-0
  acc:
    title: Statbel - Road accidents 2023
    url: https://statbel.fgov.be/en/open-data/road-accidents-2023
  cas:
    title: Statbel - Road casualties 2023
    url: https://statbel.fgov.be/en/open-data/road-casualties-2023
  family:
    title: Statbel - Family names
    url: https://statbel.fgov.be/en/open-data/family-names-total-population-municipality
  cpi:
    title: Statbel - Consumer price index and health index
    url: https://statbel.fgov.be/en/open-data/consumer-price-index-and-health-index
  cars:
    title: Statbel - Cars per household type
    url: https://statbel.fgov.be/en/open-data/number-cars-household-type-municipality
  land:
    title: Statbel - Land cover
    url: https://statbel.fgov.be/en/open-data/land-cover-according-land-register
  birth:
    title: Statbel - Crude birth rate
    url: https://statbel.fgov.be/en/open-data/hvd-crude-birth-rate
  iso3166:
    title: ISO 3166 Country codes
    url: https://www.iso.org/iso-3166-country-codes.html

terms:

  # ------------------------------------------------------------------
  # Shared Business Vocabulary
  # ------------------------------------------------------------------

  - glossary: SBV
    path: []
    name: Party
    type: Subject Area
    definition: Grouping of the concepts that describe anyone, a natural person
      or an organisation, about whom information is recorded.
    synonyms:
    - Stakeholder

  - glossary: SBV
    path:
    - Party
    name: Person
    type: Business Object
    definition: A human being considered as an individual who has rights and
      obligations; the business-to-consumer side of a party.
    synonyms:
    - Natural Person
    - Individual
    - 'FR: Personne physique'
    - 'NL: Natuurlijke persoon'
    related:
    - Shared Business Vocabulary.Party.Party Type
    tags:
    - PersonalData.Personal
    steward_note: Unit counted in most population statistics.

  - glossary: SBV
    path:
    - Party
    - Person
    name: Sex
    type: Characteristic
    definition: Biological classification of a person as male or female, as
      recorded in the population register.
    synonyms:
    - Gender
    - 'FR: Sexe'
    - 'NL: Geslacht'
    source_pattern: ^(CD|TX)_(SEX|GENDER)|^MS_SEX_
    tags:
    - PersonalData.Personal
    steward_note: 9 different column names in the source for one concept.

  - glossary: SBV
    path:
    - Party
    - Person
    name: Age
    type: Characteristic
    definition: Number of full years a person has lived at the reference date.
    synonyms:
    - 'FR: Âge'
    - 'NL: Leeftijd'
    related:
    - Shared Business Vocabulary.Party.Person.Age Group
    source_pattern: ^CD_AGE$|^TX_AGE_DESCR
    tags:
    - PersonalData.Personal

  - glossary: SBV
    path:
    - Party
    - Person
    name: Age Group
    type: Classification
    definition: Grouping of ages into contiguous ranges used to publish statistics.
    synonyms:
    - Age Class
    - 'FR: Classe d''âge'
    - 'NL: Leeftijdsgroep'
    related:
    - Shared Business Vocabulary.Party.Person.Age
    source_pattern: ^CD_AGE_LVL|AGE_CLS

  - glossary: SBV
    path:
    - Party
    - Person
    name: Marital Status
    type: Characteristic
    definition: 'Legal situation of a person with respect to marriage: single,
      married, widowed or divorced.'
    synonyms:
    - Civil Status
    - Legal Marital Status
    - 'FR: État civil'
    - 'NL: Burgerlijke staat'
    source_pattern: ^(CD|TX)_LMS|MARITAL|CIV_STAT
    tags:
    - PersonalData.Personal

  - glossary: SBV
    path:
    - Party
    - Person
    name: Citizenship
    type: Characteristic
    definition: Country whose nationality a person legally holds at the reference
      date.
    synonyms:
    - Nationality
    - Country of Citizenship
    - 'FR: Nationalité'
    - 'NL: Nationaliteit'
    related:
    - Shared Business Vocabulary.Location.Country
    source_pattern: _COC_|NATIONALITY|^CD_NATLTY
    tags:
    - PersonalData.Personal
    steward_note: A characteristic of Person whose values come from Country.

  - glossary: SBV
    path:
    - Party
    name: Person Name
    type: Business Object
    definition: Words by which a person is known and identified, made of one
      or more first names and a family name.
    synonyms:
    - Personal Name
    - 'FR: Nom de personne'
    - 'NL: Persoonsnaam'
    tags:
    - PersonalData.Personal
    references:
    - family
    steward_note: 'Anticipated shared term: reused by any business-to-consumer
      domain.'

  - glossary: SBV
    path:
    - Party
    - Person Name
    name: First Name
    type: Characteristic
    definition: Name given to a person at birth or later, used to distinguish
      the person from members of the same family.
    synonyms:
    - Given Name
    - Forename
    - 'FR: Prénom'
    - 'NL: Voornaam'
    tags:
    - PersonalData.Personal

  - glossary: SBV
    path:
    - Party
    - Person Name
    name: Family Name
    type: Characteristic
    definition: Name shared by members of a family and passed on by descent
      or by law.
    synonyms:
    - Surname
    - Last Name
    - 'FR: Nom de famille'
    - 'NL: Familienaam'
    tags:
    - PersonalData.Personal
    references:
    - family

  - glossary: SBV
    path:
    - Party
    name: Organisation
    type: Business Object
    definition: A legal person or other body set up to pursue an activity, recognised
      as a party distinct from the people who compose it.
    synonyms:
    - Legal Person
    - Legal Entity
    - 'FR: Personne morale'
    - 'NL: Rechtspersoon'
    related:
    - Shared Business Vocabulary.Party.Party Type
    steward_note: The business-to-business side of a party.

  - glossary: SBV
    path:
    - Party
    - Organisation
    name: Legal Form
    type: Classification
    definition: Legal structure under which an organisation is constituted,
      such as a public limited company or a non-profit association.
    synonyms:
    - Juridical Form
    - 'FR: Forme juridique'
    - 'NL: Rechtsvorm'
    source_pattern: LEGAL_FORM

  - glossary: SBV
    path:
    - Party
    - Organisation
    name: Enterprise Number
    type: Identifier
    definition: Unique number given by the Crossroads Bank for Enterprises to
      every registered enterprise in Belgium.
    synonyms:
    - KBO Number
    - BCE Number
    - Company Number
    - 'FR: Numéro d''entreprise'
    - 'NL: Ondernemingsnummer'
    steward_note: 'Not present in the open data (anonymised) but anticipated:
      it is the key to align with any other B2B domain.'

  - glossary: SBV
    path:
    - Party
    name: Party Type
    type: Classification
    definition: Classification of a party as a natural person or a legal person.
    synonyms:
    - Enterprise Type
    - Person Type
    - 'FR: Type de personne'
    - 'NL: Persoonstype'
    related:
    - Shared Business Vocabulary.Party.Person
    - Shared Business Vocabulary.Party.Organisation
    source_pattern: ^TYPE_ENT
    steward_note: The B2C / B2B split; source column names it 'type of enterprise'.

  - glossary: SBV
    path:
    - Party
    name: Party Relationship
    type: Business Object
    definition: Link between two parties in which one party plays a defined
      role towards the other, such as employment, ownership or directorship.
    synonyms:
    - Party Role
    - 'FR: Relation entre parties'
    - 'NL: Relatie tussen partijen'
    related:
    - Shared Business Vocabulary.Party.Person
    - Shared Business Vocabulary.Party.Organisation
    steward_note: Holds who works for, owns or manages whom; the reason Party
      is modelled once.

  - glossary: SBV
    path:
    - Party
    - Party Relationship
    name: Party Relationship Type
    type: Classification
    definition: 'Classification of the role one party plays towards another:
      employee, owner or shareholder, director or administrator, or self-employed
      operator of its own business.'
    synonyms:
    - Role Type
    - 'FR: Type de relation'
    - 'NL: Type relatie'
    source_pattern: ^MS_EMPL_
    steward_note: Statbel publishes jobs (employment relationships) as counts,
      e.g. MS_EMPL_TOT.

  - glossary: SBV
    path: []
    name: Location
    type: Subject Area
    definition: Grouping of the concepts that describe where something is, happens
      or is registered.
    synonyms:
    - Geography
    - Place

  - glossary: SBV
    path:
    - Location
    name: Address
    type: Business Object
    definition: Structured information that identifies a physical or postal
      location at which a party resides, operates or receives mail.
    synonyms:
    - Postal Address
    - 'FR: Adresse'
    - 'NL: Adres'
    tags:
    - PersonalData.Personal
    references:
    - address
    steward_note: Defined in DG-STD-001 section 7; reused here, not redefined.

  - glossary: SBV
    path:
    - Location
    - Address
    name: Street
    type: Business Object
    definition: Public road identified by an official name and code within a
      municipality.
    synonyms:
    - 'FR: Rue'
    - 'NL: Straat'
    source_pattern: ^CD_STR$|^TX_STR_NM

  - glossary: SBV
    path:
    - Location
    - Address
    name: House Number
    type: Characteristic
    definition: Number, with optional suffix, given to a building or plot along
      a street.
    synonyms:
    - 'FR: Numéro de police'
    - 'NL: Huisnummer'
    source_pattern: ^TX_HO_NR|^FL_EVEN

  - glossary: SBV
    path:
    - Location
    - Address
    name: Postal Code
    type: Characteristic
    definition: Code of the postal delivery area to which an address belongs.
    synonyms:
    - Post Code
    - ZIP Code
    - 'FR: Code postal'
    - 'NL: Postcode'
    source_pattern: ^CD_ZIP|POSTAL|POST_CODE

  - glossary: SBV
    path:
    - Location
    name: Geographic Coordinates
    type: Characteristic
    definition: Pair of values that positions a location on the earth's surface
      in a stated reference system.
    synonyms:
    - XY
    - Geocode
    - Latitude and Longitude
    source_pattern: ^XY_|^MS_X_COORD|^MS_Y_COORD|LATITUDE|LONGITUDE

  - glossary: SBV
    path:
    - Location
    name: Administrative Area
    type: Business Object
    definition: Part of the Belgian territory with defined boundaries, used
      for administration or statistics and identified by a REFNIS code.
    synonyms:
    - Geographic Entity
    - REFNIS Area
    - 'FR: Entité administrative'
    - 'NL: Administratieve eenheid'
    related:
    - Shared Business Vocabulary.Location.Administrative Area.REFNIS Code
    source_pattern: REFNIS|^CD_NIVEAU
    references:
    - refnis
    steward_note: 117 column names in the source refer to these areas.

  - glossary: SBV
    path:
    - Location
    - Administrative Area
    name: Region
    type: Business Object
    definition: 'One of the three federated regions of Belgium: Brussels-Capital,
      Flemish and Walloon.'
    synonyms:
    - 'FR: Région'
    - 'NL: Gewest'
    source_pattern: _RGN_|^CD_REGION|REGION_|_REFNIS_LVL_1$

  - glossary: SBV
    path:
    - Location
    - Administrative Area
    name: Province
    type: Business Object
    definition: Administrative subdivision of a region, of which Belgium counts
      ten.
    synonyms:
    - 'FR: Province'
    - 'NL: Provincie'
    source_pattern: PROV|_REFNIS_LVL_2$

  - glossary: SBV
    path:
    - Location
    - Administrative Area
    name: Administrative District
    type: Business Object
    definition: Administrative subdivision of a province grouping several municipalities.
    synonyms:
    - Arrondissement
    - 'FR: Arrondissement'
    - 'NL: Arrondissement'
    source_pattern: ^CD_DSTR|ADM_DSTR|_REFNIS_LVL_3$

  - glossary: SBV
    path:
    - Location
    - Administrative Area
    name: Municipality
    type: Business Object
    definition: Lowest level of local government, of which Belgium counts 565
      since 2025.
    synonyms:
    - Commune
    - 'FR: Commune'
    - 'NL: Gemeente'
    source_pattern: MUNTY|_REFNIS_LVL_4$|MUNICIP

  - glossary: SBV
    path:
    - Location
    - Administrative Area
    name: Statistical Sector
    type: Business Object
    definition: Smallest territorial unit defined by Statbel inside a municipality
      for statistical publication.
    synonyms:
    - 'FR: Secteur statistique'
    - 'NL: Statistische sector'
    source_pattern: SECTOR
    references:
    - sector

  - glossary: SBV
    path:
    - Location
    - Administrative Area
    name: REFNIS Code
    type: Identifier
    definition: Code that identifies an administrative area in the national
      REFNIS nomenclature maintained by Statbel.
    synonyms:
    - NIS Code
    - 'FR: Code INS'
    - 'NL: NIS-code'
    source_pattern: ^CD_.*REFNIS|^CD_REFNIS
    references:
    - refnis

  - glossary: SBV
    path:
    - Location
    name: NUTS Region
    type: Classification
    definition: Territorial unit of the European Nomenclature of Territorial
      Units for Statistics.
    synonyms:
    - 'FR: Région NUTS'
    - 'NL: NUTS-regio'
    source_pattern: NUTS
    references:
    - nuts

  - glossary: SBV
    path:
    - Location
    name: Country
    type: Business Object
    definition: Sovereign state or territory identified by an ISO 3166-1 code.
    synonyms:
    - 'FR: Pays'
    - 'NL: Land'
    source_pattern: COUNTRY|_COC_|_POB_|_COB_
    references:
    - iso3166

  - glossary: SBV
    path:
    - Location
    name: Grid Cell
    type: Business Object
    definition: Square of fixed size in a European reference grid used to publish
      statistics independently of administrative boundaries.
    synonyms:
    - Km² Grid Cell
    - 'FR: Cellule de grille'
    - 'NL: Rastercel'
    source_pattern: GRD|GRID

  - glossary: SBV
    path: []
    name: Time
    type: Subject Area
    definition: Grouping of the concepts that position facts and statistics
      in time.
    synonyms:
    - Calendar

  - glossary: SBV
    path:
    - Time
    name: Reference Period
    type: Characteristic
    definition: Period of time, such as a year, quarter, month or day, to which
      a statistic or a fact refers.
    synonyms:
    - Period
    - 'FR: Période de référence'
    - 'NL: Referentieperiode'
    source_pattern: ^CD_YEAR|^YEAR$|^MONTH$|^CD_PERIOD|^NM_YR|^DT_DATE|^DT_DAY$|^CD_MONTH|^DT_YEAR|^DT_MONTH

  - glossary: SBV
    path:
    - Time
    name: Reference Date
    type: Characteristic
    definition: Calendar day at which a stock, such as a population or a building
      stock, is measured.
    synonyms:
    - Snapshot Date
    - 'FR: Date de référence'
    - 'NL: Referentiedatum'
    source_pattern: ^DT_DATE|^DT_REF

  - glossary: SBV
    path:
    - Time
    name: Validity Period
    type: Characteristic
    definition: Start and end dates between which a code, area or record is
      valid.
    synonyms:
    - Valid From - Valid To
    - 'FR: Période de validité'
    - 'NL: Geldigheidsperiode'
    source_pattern: VLDT|^DT_STRT|^DT_STOP

  - glossary: SBV
    path: []
    name: Statistical Classifications
    type: Subject Area
    definition: Grouping of the official classifications used to code activities,
      occupations, education and products.
    synonyms:
    - Nomenclatures
    - Code Lists

  - glossary: SBV
    path:
    - Statistical Classifications
    name: Economic Activity
    type: Classification
    definition: Kind of production in which a unit is engaged, coded in the
      NACE-BEL classification.
    synonyms:
    - Activity Sector
    - NACE Code
    - 'FR: Activité économique'
    - 'NL: Economische activiteit'
    source_pattern: NACE|_IND_|^CD_IND$
    references:
    - nace

  - glossary: SBV
    path:
    - Statistical Classifications
    name: Occupation
    type: Classification
    definition: Kind of work performed in a job, coded in the ISCO-08 classification.
    synonyms:
    - Profession
    - 'FR: Profession'
    - 'NL: Beroep'
    source_pattern: ISCO|_OCC_|^CD_OCC
    references:
    - isco

  - glossary: SBV
    path:
    - Statistical Classifications
    name: Field of Education
    type: Classification
    definition: Subject domain of an education programme or qualification, coded
      in ISCED-F 2013.
    synonyms:
    - 'FR: Domaine d''études'
    - 'NL: Studiegebied'
    source_pattern: ISCED|_FOS_
    references:
    - isced

  - glossary: SBV
    path:
    - Statistical Classifications
    name: Product Category
    type: Classification
    definition: Group of goods or services in a product classification such
      as CPA, PRODCOM or COICOP.
    synonyms:
    - Product Group
    - 'FR: Groupe de produits'
    - 'NL: Productgroep'
    source_pattern: COICOP|PRODCOM|^CD_CPA

  # ------------------------------------------------------------------
  # Population and Households
  # ------------------------------------------------------------------

  - glossary: POP
    path: []
    name: Population
    type: Subject Area
    definition: Grouping of the concepts that describe the people living in
      Belgium and where they live.

  - glossary: POP
    path:
    - Population
    name: Resident Population
    type: Business Object
    definition: All persons whose main residence is registered in Belgium at
      the reference date.
    synonyms:
    - Legal Population
    - 'FR: Population résidente'
    - 'NL: Bevolking'
    related:
    - Shared Business Vocabulary.Party.Person
    - Shared Business Vocabulary.Time.Reference Date

  - glossary: POP
    path:
    - Population
    name: Population Count
    type: Measure
    definition: Number of persons in the resident population that share the
      stated characteristics at the reference date.
    synonyms:
    - Number of Inhabitants
    - 'FR: Nombre d''habitants'
    - 'NL: Aantal inwoners'
    related:
    - Population and Households.Population.Resident Population
    source_pattern: ^MS_POP|^MS_TOT_RESIDENTS|^MS_NBR_PERS

  - glossary: POP
    path:
    - Population
    name: Place of Residence
    type: Role
    definition: Administrative area where a person has the main residence at
      the reference date.
    synonyms:
    - 'FR: Lieu de résidence'
    - 'NL: Woonplaats'
    related:
    - Shared Business Vocabulary.Location.Administrative Area
    source_pattern: _REFNIS_LVL_|_RES_LVL

  - glossary: POP
    path:
    - Population
    name: Place of Residence One Year Before
    type: Role
    definition: Administrative area or country where a person had the main residence
      one year before the reference date.
    synonyms:
    - 'FR: Lieu de résidence un an auparavant'
    - 'NL: Woonplaats een jaar eerder'
    related:
    - Shared Business Vocabulary.Location.Administrative Area
    - Shared Business Vocabulary.Location.Country
    source_pattern: _ROY_

  - glossary: POP
    path:
    - Population
    name: Place of Birth
    type: Role
    definition: Country, or administrative area for persons born in Belgium,
      where a person was born.
    synonyms:
    - Country of Birth
    - 'FR: Lieu de naissance'
    - 'NL: Geboorteplaats'
    related:
    - Shared Business Vocabulary.Location.Country
    - Shared Business Vocabulary.Location.Administrative Area
    source_pattern: _POB_|_COB_
    tags:
    - PersonalData.Personal

  - glossary: POP
    path:
    - Population
    name: Year of Arrival in Belgium
    type: Characteristic
    definition: Year in which a person born abroad most recently established
      residence in Belgium.
    synonyms:
    - 'FR: Année d''immigration'
    - 'NL: Jaar van immigratie'
    source_pattern: _YAE

  - glossary: POP
    path: []
    name: Household
    type: Subject Area
    definition: Grouping of the concepts that describe how persons live together.

  - glossary: POP
    path:
    - Household
    name: Private Household
    type: Business Object
    definition: One person living alone or several persons sharing the same
      main residence and providing for their own needs.
    synonyms:
    - Household
    - 'FR: Ménage privé'
    - 'NL: Privéhuishouden'
    source_pattern: ^MS_NUM_HH|^MS_MENAGES

  - glossary: POP
    path:
    - Household
    name: Household Type
    type: Classification
    definition: Classification of private households by their composition, such
      as single person or couple with children.
    synonyms:
    - 'FR: Type de ménage'
    - 'NL: Huishoudtype'
    source_pattern: HH_TYPE|_TFN_

  - glossary: POP
    path:
    - Household
    name: Position in Household
    type: Classification
    definition: Role a person holds within a private household, such as reference
      person, partner or child.
    synonyms:
    - 'FR: Position dans le ménage'
    - 'NL: Positie in het huishouden'
    source_pattern: _HST_

  - glossary: POP
    path:
    - Household
    name: Family Nucleus
    type: Business Object
    definition: Two or more persons of the same private household who are a
      couple, with or without children, or a parent with children.
    synonyms:
    - Family
    - 'FR: Noyau familial'
    - 'NL: Gezinskern'
    related:
    - Population and Households.Household.Private Household
    source_pattern: NOYAUX|_NUCL

  - glossary: POP
    path:
    - Household
    name: Position in Family
    type: Classification
    definition: Role a person holds within a family nucleus, such as partner,
      lone parent or child.
    synonyms:
    - Family Status
    - 'FR: Position dans la famille'
    - 'NL: Positie in het gezin'
    source_pattern: _FST

  - glossary: POP
    path:
    - Household
