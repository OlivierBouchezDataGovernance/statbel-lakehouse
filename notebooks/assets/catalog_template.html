<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<!-- © 2026 Olivier Bouchez · CC BY-NC 4.0 · https://olivier-bouchez.com · Data: Statbel open data, CC BY 4.0 -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catalogue StatBel Open Data</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #5f6b7a; --border: #dfe3ea;
  --accent: #0b5cad; --accent-soft: #e7f0fa; --chip: #eef1f5; --key: #7a2e8e;
  --hl: #fff4c2; --shadow: 0 1px 2px rgba(16,24,40,.06);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12151b; --panel: #1a1f27; --text: #e6e9ef; --muted: #9aa5b4; --border: #2c333f;
    --accent: #6cb0ff; --accent-soft: #1d2d42; --chip: #252c37; --key: #d39cf0;
    --hl: #4a3f12; --shadow: none;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh;
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
a { color: var(--accent); }
header { padding: 14px 16px 10px; border-bottom: 1px solid var(--border); background: var(--panel); }
.top { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
h1 { font-size: 18px; margin: 0; }
.sub { color: var(--muted); font-size: 13px; }
.langs { margin-left: auto; display: flex; gap: 4px; }
.langs button { border: 1px solid var(--border); background: var(--panel); color: var(--text);
  border-radius: 6px; padding: 2px 8px; cursor: pointer; font: inherit; font-size: 12px; }
.langs button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; align-items: center; }
.filters input[type=search], .filters select { font: inherit; padding: 6px 10px; border-radius: 8px;
  border: 1px solid var(--border); background: var(--bg); color: var(--text); }
.filters input[type=search] { flex: 1 1 280px; min-width: 0; }
.filters label { color: var(--muted); font-size: 13px; display: flex; gap: 6px; align-items: center; }
.count { color: var(--muted); font-size: 13px; }

main { display: grid; grid-template-columns: minmax(320px, 440px) 1fr; flex: 1; min-height: 0; }
#list { overflow-y: auto; border-right: 1px solid var(--border); padding: 8px; }
#detail { overflow-y: auto; padding: 20px 28px 40px; }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px;
  margin-bottom: 8px; cursor: pointer; box-shadow: var(--shadow); }
.card:hover { border-color: var(--accent); }
.card[aria-current="true"] { border-color: var(--accent); background: var(--accent-soft); }
.card h3 { font-size: 14px; margin: 0 0 2px; font-weight: 600; }
.meta { color: var(--muted); font-size: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
.chips { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
.chip { background: var(--chip); border-radius: 999px; padding: 1px 8px; font-size: 12px; white-space: nowrap;
  border: 1px solid transparent; color: var(--text); font-family: inherit; }
button.chip { cursor: pointer; }
button.chip:hover { border-color: var(--accent); }
.chip.fmt { font-weight: 600; font-size: 11px; }
.badge { background: var(--accent-soft); color: var(--accent); border-radius: 4px; padding: 0 6px; font-size: 11px; font-weight: 600; }
.badge.hvd { background: #e8f5e9; color: #1b7a32; }
@media (prefers-color-scheme: dark) { .badge.hvd { background: #173322; color: #7fd69a; } }

.empty { color: var(--muted); padding: 40px 0; text-align: center; }
#detail h2 { margin: 0 0 4px; font-size: 22px; line-height: 1.3; }
#detail h3 { font-size: 15px; margin: 28px 0 8px; padding-bottom: 4px; border-bottom: 1px solid var(--border); }
.alt { color: var(--muted); margin-bottom: 12px; }
.desc { white-space: pre-line; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; }
dl.grid { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 14px 0 0; }
dl.grid dt { color: var(--muted); }
dl.grid dd { margin: 0; }
table { border-collapse: collapse; width: 100%; background: var(--panel); font-size: 13px; }
th, td { border: 1px solid var(--border); padding: 5px 8px; text-align: left; vertical-align: top; }
th { background: var(--chip); font-weight: 600; position: sticky; top: 0; }
td.key { font-family: ui-monospace, Consolas, monospace; color: var(--key); font-weight: 600; white-space: nowrap; }
tr.hl td { background: var(--hl); }
.tablewrap { overflow: auto; max-height: 520px; border-radius: 6px; border: 1px solid var(--border); }
.tablewrap table { border: 0; }
.doc { margin-top: 14px; }
.doc-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
.doc-head .name { font-weight: 600; }
.doc-head input { margin-left: auto; font: inherit; font-size: 12px; padding: 3px 8px; border-radius: 6px;
  border: 1px solid var(--border); background: var(--bg); color: var(--text); }
.sheet { color: var(--muted); font-size: 12px; margin: 10px 0 4px; }
.note { color: var(--muted); font-size: 12px; margin-top: 4px; }
.warn { color: #b54708; }
.back { display: none; }

@media (max-width: 860px) {
  body { display: block; height: auto; }
  main { display: block; }
  #list { border-right: 0; }
  #detail { display: none; padding: 16px; }
  body.show-detail #list { display: none; }
  body.show-detail #detail { display: block; }
  .back { display: inline-block; margin-bottom: 12px; font: inherit; background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; }
  dl.grid { grid-template-columns: 1fr; gap: 0 0; }
  dl.grid dd { margin-bottom: 8px; }
}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1 id="title">Catalogue StatBel Open Data</h1>
    <span class="sub" id="subtitle"></span>
    <div class="langs" role="group" aria-label="Langue des métadonnées">
      <button data-lang="fr">FR</button><button data-lang="nl">NL</button><button data-lang="en">EN</button><button data-lang="de">DE</button>
    </div>
  </div>
  <div class="filters">
    <input type="search" id="q" placeholder="Rechercher un jeu de données, un fichier, un mot-clé ou un champ (ex. CD_REFNIS)…" autocomplete="off">
    <select id="theme"><option value="">Tous les thèmes</option></select>
    <select id="format"><option value="">Tous les formats</option></select>
    <label><input type="checkbox" id="withFields"> avec description des champs</label>
    <span class="count" id="count"></span>
  </div>
</header>
<main>
  <nav id="list" aria-label="Jeux de données"></nav>
  <section id="detail" aria-live="polite"><div class="empty">Sélectionnez un fichier dans la liste pour voir son détail et la description de ses champs.</div></section>
</main>

<script id="catalog-data" type="application/json">__CATALOG_DATA__</script>
<script>
"use strict";
const DATA = JSON.parse(document.getElementById("catalog-data").textContent);
const DS = DATA.datasets, DOCS = DATA.docs, THEMES = DATA.themes;
const state = { lang: localGet("lang") || "fr", q: "", theme: "", format: "", withFields: false, current: null, file: null };

function localGet(k) { try { return localStorage.getItem("statbel." + k); } catch (e) { return null; } }
function localSet(k, v) { try { localStorage.setItem("statbel." + k, v); } catch (e) {} }
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const norm = s => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();

/** Texte multilingue dans la langue choisie, avec repli. */
function t(obj) {
  if (!obj) return "";
  for (const l of [state.lang, "fr", "en", "nl", "de", "und"]) if (obj[l]) return obj[l];
  return Object.values(obj)[0] || "";
}
const year = d => (d || "").slice(0, 4);
function period(d) {
  if (!d.start) return "";
  const a = year(d.start), b = year(d.end);
  return a === b || !b ? a : `${a}–${b}`;
}
const fieldDocs = d => d.docs.filter(doc => DOCS[doc.url]);
const hasFields = d => fieldDocs(d).some(doc => DOCS[doc.url].sheets && DOCS[doc.url].sheets.length);

// Index de recherche : titres, mots-clés, fichiers et noms de champs (toutes langues)
for (const d of DS) {
  const parts = [d.id, ...Object.values(d.title), ...Object.values(d.alternative), ...Object.values(d.keywords).flat(),
    ...d.files.map(f => f.name)];
  for (const doc of fieldDocs(d)) for (const sh of DOCS[doc.url].sheets || [])
    if (sh.key !== null) parts.push(...sh.rows.map(r => r[sh.key]));
  d._search = norm(parts.join(" "));
  d._fields = hasFields(d);
}

// --- Filtres --------------------------------------------------------------
function initFilters() {
  const themeSel = document.getElementById("theme");
  const used = [...new Set(DS.flatMap(d => d.themes))].sort();
  themeSel.innerHTML = `<option value="">Tous les thèmes</option>` +
    used.map(c => `<option value="${esc(c)}">${esc(THEMES[c] ? t(THEMES[c]) : c)}</option>`).join("");
  themeSel.value = state.theme;
  const formats = [...new Set(DS.flatMap(d => d.files.map(f => f.format)))].sort();
  document.getElementById("format").innerHTML = `<option value="">Tous les formats</option>` +
    formats.map(f => `<option>${esc(f)}</option>`).join("");
  document.getElementById("format").value = state.format;
}

function filtered() {
  const words = norm(state.q).split(/\s+/).filter(Boolean);
  return DS.filter(d =>
    (!state.theme || d.themes.includes(state.theme)) &&
    (!state.format || d.files.some(f => f.format === state.format)) &&
    (!state.withFields || d._fields) &&
    words.every(w => d._search.includes(w)));
}

// --- Liste ------------------------------------------------------------------
function renderList() {
  const items = filtered();
  document.getElementById("count").textContent = `${items.length} / ${DS.length} jeux de données`;
  const list = document.getElementById("list");
  if (!items.length) { list.innerHTML = `<div class="empty">Aucun résultat.</div>`; return; }
  list.innerHTML = items.map(d => `
    <article class="card" data-id="${esc(d.id)}" ${d.id === state.current ? 'aria-current="true"' : ""} tabindex="0">
      <h3>${esc(t(d.title))}</h3>
      <div class="meta">
        ${period(d) ? `<span>${esc(period(d))}</span>` : ""}
        <span>${d.files.length} fichier${d.files.length > 1 ? "s" : ""}</span>
        ${d._fields ? `<span class="badge">champs décrits</span>` : ""}
        ${d.hvd ? `<span class="badge hvd">High Value</span>` : ""}
      </div>
      <div class="chips">${d.files.map((f, i) =>
        `<button class="chip" data-file="${i}" title="${esc(f.url)}">${esc(f.name)}</button>`).join("")}</div>
    </article>`).join("");
}

// --- Détail -----------------------------------------------------------------
function renderSheet(sheet, docIdx, sheetIdx) {
  const key = sheet.key;
  const head = sheet.headers.map((h, i) => `<th>${esc(h)}</th>`).join("");
  const body = sheet.rows.map(r => `<tr>${r.map((c, i) =>
    `<td${i === key ? ' class="key"' : ""}>${esc(c)}</td>`).join("")}</tr>`).join("");
  const more = sheet.total > sheet.rows.length
    ? `<div class="note">${sheet.rows.length} premières lignes affichées sur ${sheet.total}.</div>` : "";
  return `<div class="sheet">Feuille « ${esc(sheet.name)} » — ${sheet.total} ligne${sheet.total > 1 ? "s" : ""}</div>
    <div class="tablewrap"><table data-doc="${docIdx}"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>${more}`;
}

function renderFields(d) {
  const docs = fieldDocs(d);
  if (!docs.length) {
    return `<p class="note">StatBel ne publie pas de fichier de description des champs pour ce jeu de données.
      Consultez les métadonnées PDF ci-dessous ou la page StatBel.</p>`;
  }
  return docs.map((doc, i) => {
    const info = DOCS[doc.url];
    const sheets = info.sheets || [];
    return `<div class="doc">
      <div class="doc-head"><span class="name">${esc(doc.name)}</span>
        <a href="${esc(doc.url)}">télécharger</a>
        ${sheets.length ? `<input type="search" placeholder="Filtrer les champs…" data-filter="${i}">` : ""}</div>
      ${info.error ? `<div class="note warn">Fichier indisponible ou illisible : ${esc(info.error)}</div>` : ""}
      ${!info.error && !sheets.length ? `<div class="note">Fichier vide.</div>` : ""}
      <div data-doc-body="${i}">${sheets.map((s, j) => renderSheet(s, i, j)).join("")}</div>
    </div>`;
  }).join("");
}

function renderDetail() {
  const box = document.getElementById("detail");
  const d = DS.find(x => x.id === state.current);
  document.body.classList.toggle("show-detail", !!d);
  if (!d) { box.innerHTML = `<div class="empty">Sélectionnez un fichier dans la liste pour voir son détail et la description de ses champs.</div>`; return; }

  const landing = d.landing[state.lang] || t(d.landing);
  const kw = d.keywords[state.lang] || t(d.keywords) || [];
  const pdfs = d.docs.filter(doc => !DOCS[doc.url]);
  const pdfLangOrder = doc => doc.lang === state.lang ? 0 : 1;

  box.innerHTML = `
    <button class="back" id="back">← Retour à la liste</button>
    <h2>${esc(t(d.title))}</h2>
    <div class="alt">${esc(t(d.alternative))}</div>
    <div class="desc">${esc(t(d.description))}</div>
    <dl class="grid">
      <dt>Période</dt><dd>${esc(d.start || "?")} → ${esc(d.end || "?")}</dd>
      <dt>Thèmes</dt><dd>${d.themes.map(c => `<span class="chip">${esc(THEMES[c] ? t(THEMES[c]) : c)}</span>`).join(" ") || "—"}</dd>
      <dt>Mots-clés</dt><dd>${(Array.isArray(kw) ? kw : []).map(k => `<span class="chip">${esc(k)}</span>`).join(" ") || "—"}</dd>
      <dt>Licence</dt><dd>${d.license ? `<a href="${esc(d.license.url)}" target="_blank" rel="noopener">${esc(d.license.label)}</a>` : "—"}</dd>
      <dt>Page StatBel</dt><dd>${landing ? `<a href="${esc(landing)}" target="_blank" rel="noopener">${esc(landing)}</a>` : "—"}</dd>
      <dt>Identifiant</dt><dd>${esc(d.uri)}</dd>
    </dl>

    <h3>Fichiers disponibles (${d.files.length})</h3>
    <div class="tablewrap"><table>
      <thead><tr><th>Fichier</th><th>Format</th><th>Compression</th><th></th></tr></thead>
      <tbody>${d.files.map((f, i) => `<tr id="file-${i}" ${i === state.file ? 'class="hl"' : ""}>
        <td>${esc(f.name)}</td><td><span class="chip fmt">${esc(f.format)}</span></td>
        <td>${esc(f.compressed || "")}</td><td><a href="${esc(f.url)}">télécharger</a></td></tr>`).join("")}</tbody>
    </table></div>

    <h3>Description des champs</h3>
    ${renderFields(d)}

    ${pdfs.length ? `<h3>Métadonnées et documentation</h3><ul>${pdfs.sort((a, b) => pdfLangOrder(a) - pdfLangOrder(b))
      .map(doc => `<li><a href="${esc(doc.url)}" target="_blank" rel="noopener">${esc(doc.name)}</a>
        ${doc.lang ? `<span class="chip">${esc(doc.lang.toUpperCase())}</span>` : ""}</li>`).join("")}</ul>` : ""}
  `;
  box.scrollTop = 0;
  document.getElementById("back").onclick = () => { location.hash = ""; };
  box.querySelectorAll("input[data-filter]").forEach(inp => inp.addEventListener("input", () => {
    const w = norm(inp.value);
    box.querySelectorAll(`[data-doc-body="${inp.dataset.filter}"] tbody tr`).forEach(tr => {
      tr.hidden = w && !norm(tr.textContent).includes(w);
    });
  }));
  // Pré-filtrer les tableaux de champs sur la recherche si elle vise un champ
  const q = state.q.trim();
  if (q) box.querySelectorAll("input[data-filter]").forEach(inp => {
    const hit = [...box.querySelectorAll(`[data-doc-body="${inp.dataset.filter}"] td.key`)].some(td => norm(td.textContent).includes(norm(q)));
    if (hit) { inp.value = q; inp.dispatchEvent(new Event("input")); }
  });
  if (state.file !== null) document.getElementById(`file-${state.file}`)?.scrollIntoView({ block: "center" });
}

// --- Navigation (#<id> ou #<id>/<index fichier>) -------------------------------
function route() {
  const [id, file] = decodeURIComponent(location.hash.slice(1)).split("/");
  state.current = id || null;
  state.file = file !== undefined && file !== "" ? Number(file) : null;
  document.querySelectorAll(".card").forEach(c => {
    if (c.dataset.id === state.current) c.setAttribute("aria-current", "true"); else c.removeAttribute("aria-current");
  });
  renderDetail();
  if (window.innerWidth > 860) document.querySelector('.card[aria-current="true"]')?.scrollIntoView({ block: "nearest" });
}

function setLang(lang) {
  state.lang = lang; localSet("lang", lang);
  document.documentElement.lang = lang;
  document.querySelectorAll(".langs button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
  document.getElementById("subtitle").textContent =
    `${DS.length} jeux de données · ${DS.reduce((n, d) => n + d.files.length, 0)} fichiers · catalogue du ${DATA.catalog.modified || "?"} · généré le ${DATA.generated}`;
  initFilters(); renderList(); renderDetail();
}

document.getElementById("list").addEventListener("click", e => {
  const card = e.target.closest(".card"); if (!card) return;
  const chip = e.target.closest("[data-file]");
  location.hash = encodeURIComponent(card.dataset.id) + (chip ? "/" + chip.dataset.file : "");
});
document.getElementById("list").addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.classList.contains("card")) location.hash = encodeURIComponent(e.target.dataset.id);
});
let timer;
document.getElementById("q").addEventListener("input", e => { clearTimeout(timer); timer = setTimeout(() => { state.q = e.target.value; renderList(); }, 120); });
document.getElementById("theme").addEventListener("change", e => { state.theme = e.target.value; renderList(); });
document.getElementById("format").addEventListener("change", e => { state.format = e.target.value; renderList(); });
document.getElementById("withFields").addEventListener("change", e => { state.withFields = e.target.checked; renderList(); });
document.querySelectorAll(".langs button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.lang)));
window.addEventListener("hashchange", route);

setLang(state.lang);
route();
</script>
</body>
</html>
